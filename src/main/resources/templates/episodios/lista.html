<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title>Episodios</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
  <span class="brand">Streaming</span>
  <a href="/web/series">Series</a>
  <a href="/web/episodios">Episodios</a>
</nav>
<div class="container">
  <h1>Todos los Episodios</h1>
  <div class="card">
    <div class="filter-bar">
      <form method="get" action="/web/episodios">
        <select name="serieId" onchange="this.form.submit()">
          <option value="">-- Todas las series --</option>
          <option th:each="s : ${series}" th:value="${s.id}" th:text="${s.titulo}"></option>
        </select>
      </form>
      <a href="/web/episodios/nuevo" class="btn btn-success" style="margin-left:auto">+ Nuevo Episodio</a>
    </div>
    <table>
      <thead>
        <tr><th>ID</th><th>Serie</th><th>Temp.</th><th>Nº</th><th>Título</th><th>Duración</th><th>Emisión</th><th>Acciones</th></tr>
      </thead>
      <tbody>
        <tr th:each="e : ${episodios}">
          <td th:text="${e.id}"></td>
          <td th:text="${e.serie.titulo}"></td>
          <td th:text="${e.temporada}"></td>
          <td th:text="${e.numero}"></td>
          <td th:text="${e.titulo}"></td>
          <td th:text="${e.duracionMin} + ' min'"></td>
          <td th:text="${e.fechaEmision}"></td>
          <td>
            <div class="actions">
              <a th:href="@{/web/episodios/editar/{id}(id=${e.id})}" class="btn btn-primary btn-sm">Editar</a>
              <form th:action="@{/web/episodios/borrar/{id}(id=${e.id})}" method="post">
                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Borrar?')">Borrar</button>
              </form>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
