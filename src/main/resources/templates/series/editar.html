<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Editar Serie</title></head>
<body>
<h1>Editar Serie</h1>
<form method="post" th:action="@{/web/series/editar/{id}(id=${serie.id})}">
  <label>Título: <input type="text" name="titulo" th:value="${serie.titulo}" required></label><br>
  <label>Género: <input type="text" name="genero" th:value="${serie.genero}" required></label><br>
  <label>Plataforma: <input type="text" name="plataforma" th:value="${serie.plataforma}" required></label><br>
  <label>Año estreno: <input type="number" name="anoEstreno" th:value="${serie.anoEstreno}" required></label><br>
  <button type="submit">Guardar cambios</button>
  <a href="/web/series">Cancelar</a>
</form>
</body>
</html>
