<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title>Series</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
  <span class="brand">Streaming</span>
  <a href="/web/series">Series</a>
  <a href="/web/episodios">Episodios</a>
</nav>
<div class="container">
  <h1>Series</h1>
  <div class="card">
    <div class="filter-bar">
      <form method="get" action="/web/series" style="display:flex;gap:.75rem;align-items:center;flex-wrap:wrap">
        <input type="text" name="genero" placeholder="Filtrar por género" th:value="${genero}">
        <input type="text" name="plataforma" placeholder="Filtrar por plataforma" th:value="${plataforma}">
        <button type="submit" class="btn btn-primary">Filtrar</button>
        <a href="/web/series" class="btn btn-secondary">Limpiar</a>
      </form>
      <a href="/web/series/nueva" class="btn btn-success" style="margin-left:auto">+ Nueva Serie</a>
    </div>
    <table>
      <thead>
        <tr><th>ID</th><th>Título</th><th>Género</th><th>Plataforma</th><th>Año</th><th>Acciones</th></tr>
      </thead>
      <tbody>
        <tr th:each="s : ${series}">
          <td th:text="${s.id}"></td>
          <td th:text="${s.titulo}"></td>
          <td th:text="${s.genero}"></td>
          <td><span class="badge" th:text="${s.plataforma}"></span></td>
          <td th:text="${s.anoEstreno}"></td>
          <td>
            <div class="actions">
              <a th:href="@{/web/series/{id}(id=${s.id})}" class="btn btn-secondary btn-sm">Ver</a>
              <a th:href="@{/web/series/editar/{id}(id=${s.id})}" class="btn btn-primary btn-sm">Editar</a>
              <form th:action="@{/web/series/borrar/{id}(id=${s.id})}" method="post">
                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Borrar esta serie y todos sus episodios?')">Borrar</button>
              </form>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
