<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Nueva Serie</title></head>
<body>
<h1>Nueva Serie</h1>
<form method="post" action="/web/series/nueva">
  <label>Título: <input type="text" name="titulo" required></label><br>
  <label>Género: <input type="text" name="genero" required></label><br>
  <label>Plataforma: <input type="text" name="plataforma" required></label><br>
  <label>Año estreno: <input type="number" name="anoEstreno" required></label><br>
  <button type="submit">Guardar</button>
  <a href="/web/series">Cancelar</a>
</form>
</body>
</html>
