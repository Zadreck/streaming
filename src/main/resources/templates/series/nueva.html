<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title>Nueva Serie</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
  <span class="brand">Streaming</span>
  <a href="/web/series">Series</a>
  <a href="/web/episodios">Episodios</a>
</nav>
<div class="container">
  <h1>Nueva Serie</h1>
  <div class="card">
    <form method="post" action="/web/series/nueva">
      <div class="form-group">
        <label>Título</label>
        <input type="text" name="titulo" required>
      </div>
      <div class="form-group">
        <label>Género</label>
        <input type="text" name="genero" required>
      </div>
      <div class="form-group">
        <label>Plataforma</label>
        <input type="text" name="plataforma" required>
      </div>
      <div class="form-group">
        <label>Año estreno</label>
        <input type="number" name="anoEstreno" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="/web/series" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
